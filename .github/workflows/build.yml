name: Compilar APK Offline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Crear App Cordova
        run: |
          cordova create app com.calc.pro CalculadoraPro
          rm -rf app/www/*
          cp index.html app/www/
          cd app
          cordova platform add android

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilar APK
        run: |
          cd app
          cordova build android --debug

      - name: Guardar APK como descarga
        uses: actions/upload-artifact@v3
        with:
          name: Calculadora-Pro-Offline
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
