- name: Crear App Cordova y Preparar HTML
        run: |
          cordova create mi_app com.calc.pro CalculadoraPro
          rm -rf mi_app/www/*
          cp index.html mi_app/www/index.html
          
          # Verificar y copiar el logo personalizado de 500x500
          if [ -f logo.png ]; then
            mkdir -p mi_app/res/icon/android
            cp logo.png mi_app/res/icon/android/icon.png
          fi
          
          cd mi_app
          
          # Añadir la referencia del icono al archivo config.xml de Cordova
          if [ -f ../logo.png ]; then
            sed -i '/<widget /a \    <icon src="res/icon/android/icon.png" />' config.xml
          fi
          
          cordova platform add android
