<!DOCTYPE html>
<html lang="es" data-theme="dark" data-style="feminino">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Calculadora Pro</title>
  
  <style>
    :root[data-style="feminino"][data-theme="dark"] {
      --bg-main: #0B0712;
      --bg-card: rgba(25, 18, 38, 0.85);
      --bg-input: rgba(35, 24, 54, 0.7);
      --border-color: rgba(236, 72, 153, 0.25);
      --text-primary: #FCE7F3;
      --text-secondary: #F472B6;
      --text-muted: #9CA3AF;
      --accent-gradient: linear-gradient(135deg, #EC4899 0%, #8B5CF6 100%);
      --accent-shadow: 0 10px 30px rgba(236, 72, 153, 0.4);
      --keypad-bg: rgba(21, 14, 34, 0.9);
      --btn-normal: rgba(33, 22, 49, 0.8);
      --active-glow: 0 0 20px rgba(236, 72, 153, 0.8);
      --active-border: #EC4899;
      --glass-overlay: rgba(11, 7, 18, 0.75);
    }

    :root[data-style="feminino"][data-theme="light"] {
      --bg-main: #FDF2F8;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-input: rgba(243, 232, 255, 0.8);
      --border-color: rgba(236, 72, 153, 0.3);
      --text-primary: #831843;
      --text-secondary: #DB2777;
      --text-muted: #6B7280;
      --accent-gradient: linear-gradient(135deg, #EC4899 0%, #D946EF 100%);
      --accent-shadow: 0 10px 25px rgba(236, 72, 153, 0.25);
      --keypad-bg: rgba(252, 231, 243, 0.9);
      --btn-normal: #FFFFFF;
      --active-glow: 0 0 20px rgba(219, 39, 119, 0.5);
      --active-border: #DB2777;
      --glass-overlay: rgba(253, 242, 248, 0.75);
    }

    :root[data-style="masculino"][data-theme="dark"] {
      --bg-main: #07090E;
      --bg-card: rgba(18, 24, 40, 0.85);
      --bg-input: rgba(26, 34, 54, 0.7);
      --border-color: rgba(14, 165, 233, 0.25);
      --text-primary: #F8FAFC;
      --text-secondary: #38BDF8;
      --text-muted: #64748B;
      --accent-gradient: linear-gradient(135deg, #0EA5E9 0%, #2563EB 100%);
      --accent-shadow: 0 10px 30px rgba(14, 165, 233, 0.4);
      --keypad-bg: rgba(14, 19, 34, 0.9);
      --btn-normal: rgba(23, 32, 51, 0.8);
      --active-glow: 0 0 20px rgba(14, 165, 233, 0.8);
      --active-border: #0EA5E9;
      --glass-overlay: rgba(7, 9, 14, 0.75);
    }

    :root[data-style="masculino"][data-theme="light"] {
      --bg-main: #F1F5F9;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-input: rgba(226, 232, 240, 0.8);
      --border-color: rgba(14, 165, 233, 0.3);
      --text-primary: #0F172A;
      --text-secondary: #0284C7;
      --text-muted: #94A3B8;
      --accent-gradient: linear-gradient(135deg, #0EA5E9 0%, #1D4ED8 100%);
      --accent-shadow: 0 10px 25px rgba(14, 165, 233, 0.25);
      --keypad-bg: rgba(226, 232, 240, 0.9);
      --btn-normal: #FFFFFF;
      --active-glow: 0 0 20px rgba(2, 132, 199, 0.5);
      --active-border: #0284C7;
      --glass-overlay: rgba(241, 245, 249, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-main);
      color: var(--text-primary);
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .view.active { display: flex; }

    /* CABECERA COMÚN PARA CALCULADORA NORMAL */
    .normal-top-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-bottom: 10px;
    }

    .calc-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 20px;
      font-size: 52px;
      font-weight: 800;
      color: var(--text-primary);
      word-break: break-all;
      text-align: right;
    }

    .calc-keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-bottom: 20px;
    }

    .calc-btn {
      background: var(--btn-normal);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      height: 66px;
      border-radius: 22px;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calc-btn:active { transform: scale(0.92); }
    .calc-btn.op { color: var(--text-secondary); font-weight: 800; }
    .calc-btn.equals {
      background: var(--accent-gradient);
      color: #FFFFFF;
      border: none;
      box-shadow: var(--accent-shadow);
    }

    /* MODO PRO */
    .pro-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      position: relative;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .app-title { font-size: 15px; font-weight: 800; color: var(--text-primary); }
    .controls-group { display: flex; gap: 6px; }

    .icon-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
    }

    .form-group { display: flex; flex-direction: column; gap: 3px; position: relative; }
    .form-group label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    .input-row { display: flex; gap: 8px; }

    input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      background-color: var(--bg-input);
      border: 2px solid var(--border-color);
      border-radius: 14px;
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      outline: none;
    }

    input.input-focused, .detail-card.input-focused {
      border-color: var(--active-border) !important;
      box-shadow: var(--active-glow) !important;
      background-color: rgba(255, 255, 255, 0.08) !important;
    }

    .currency-switch {
      display: flex;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 3px;
      width: 120px;
      height: 42px;
      flex-shrink: 0;
    }

    .currency-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .currency-btn.active {
      background: var(--accent-gradient);
      color: #FFFFFF;
    }

    .result-container {
      background: var(--accent-gradient);
      border-radius: 18px;
      padding: 12px;
      color: #FFFFFF;
      box-shadow: var(--accent-shadow);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      text-align: center;
    }

    .result-box-item { display: flex; flex-direction: column; gap: 1px; }
    .result-box-item:first-child { border-right: 1px solid rgba(255, 255, 255, 0.25); padding-right: 6px; }
    .result-title { font-size: 10px; font-weight: 700; text-transform: uppercase; opacity: 0.9; }
    .result-value { font-size: 22px; font-weight: 800; }

    .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

    .detail-card {
      background: var(--keypad-bg);
      border: 2px solid var(--border-color);
      padding: 6px 8px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
    }

    .detail-card input {
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      height: 24px !important;
      background: transparent !important;
    }

    .detail-label { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    .keypad-container {
      background: var(--keypad-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .key-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      height: 40px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .key-btn:active { transform: scale(0.9); background: var(--text-secondary); color: #FFFFFF; }
    .key-btn.action { background: rgba(255,255,255,0.05); color: var(--text-secondary); }

    /* TOUR GUIADO Y RESPLANDOR (7 PASOS) */
    #tour-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--glass-overlay);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
    }

    .tour-highlight {
      position: relative;
      z-index: 105 !important;
      border-color: var(--active-border) !important;
      box-shadow: 0 0 25px var(--active-border), inset 0 0 10px var(--active-border) !important;
      background-color: rgba(255, 255, 255, 0.12) !important;
      animation: pulseGlow 1.8s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px var(--active-border); }
      100% { box-shadow: 0 0 30px var(--active-border), 0 0 10px var(--text-secondary); }
    }

    #tour-card {
      position: absolute;
      bottom: 75px;
      left: 12px;
      right: 12px;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 22px;
      padding: 16px;
      z-index: 110;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(16px);
      display: none;
      flex-direction: column;
      gap: 10px;
      transform: translateY(10px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #tour-card.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .tour-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tour-step-badge {
      background: var(--accent-gradient);
      color: #FFFFFF;
      font-size: 9px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .tour-dots { display: flex; gap: 3px; max-width: 140px; overflow-x: auto; }
    .tour-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--border-color);
      transition: all 0.25s ease;
    }
    .tour-dot.active {
      width: 14px; border-radius: 8px;
      background: var(--text-secondary);
    }

    .tour-step-title { font-size: 14px; font-weight: 800; color: var(--text-primary); }
    .tour-step-desc { font-size: 12px; font-weight: 500; color: var(--text-muted); line-height: 1.4; }

    .tour-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
    }

    .tour-btn-skip {
      background: transparent; border: none;
      color: var(--text-muted); font-size: 11px; font-weight: 700; cursor: pointer;
    }

    .tour-btn-next {
      background: var(--accent-gradient); border: none;
      color: #FFFFFF; padding: 8px 18px; border-radius: 12px;
      font-size: 12px; font-weight: 800; cursor: pointer;
      box-shadow: var(--accent-shadow);
    }
  </style>
</head>
<body>

  <!-- VISTA 1: CALCULADORA NORMAL -->
  <div id="view-normal" class="view active">
    <div class="normal-top-bar">
      <button class="icon-btn" onclick="toggleStyle()" title="Estilo">🎨</button>
      <button class="icon-btn" onclick="toggleTheme()" title="Tema" id="normal-theme-btn">🌙</button>
    </div>
    <div class="calc-screen" id="calc-screen">0</div>
    <div class="calc-keypad">
      <button class="calc-btn op" onclick="calcPress('C')">C</button>
      <button class="calc-btn op" onclick="calcPress('DEL')">⌫</button>
      <button class="calc-btn op" onclick="calcPress('%')">%</button>
      <button class="calc-btn op" onclick="calcPress('/')">÷</button>

      <button class="calc-btn" onclick="calcPress('7')">7</button>
      <button class="calc-btn" onclick="calcPress('8')">8</button>
      <button class="calc-btn" onclick="calcPress('9')">9</button>
      <button class="calc-btn op" onclick="calcPress('*')">×</button>

      <button class="calc-btn" onclick="calcPress('4')">4</button>
      <button class="calc-btn" onclick="calcPress('5')">5</button>
      <button class="calc-btn" onclick="calcPress('6')">6</button>
      <button class="calc-btn op" onclick="calcPress('-')">-</button>

      <button class="calc-btn" onclick="calcPress('1')">1</button>
      <button class="calc-btn" onclick="calcPress('2')">2</button>
      <button class="calc-btn" onclick="calcPress('3')">3</button>
      <button class="calc-btn op" onclick="calcPress('+')">+</button>

      <button class="calc-btn" onclick="calcPress('0')" style="grid-column: span 2;">0</button>
      <button class="calc-btn" onclick="calcPress('.')">.</button>
      <button class="calc-btn equals" onclick="calcPress('=')">=</button>
    </div>
  </div>

  <!-- VISTA 2: MODO PRO PRECIOS -->
  <div id="view-pro" class="view">
    <div class="pro-container" id="pro-main-container">
      <div id="tour-overlay"></div>

      <!-- Cuadro de texto flotante del tour (7 pasos) -->
      <div id="tour-card">
        <div class="tour-header-bar">
          <span class="tour-step-badge" id="tour-badge">Paso 1 de 7</span>
          <div class="tour-dots" id="tour-dots"></div>
        </div>
        <div class="tour-step-title" id="tour-title">Título</div>
        <div class="tour-step-desc" id="tour-desc">Descripción...</div>
        <div class="tour-footer">
          <button class="tour-btn-skip" onclick="cerrarTour()">Omitir</button>
          <button class="tour-btn-next" onclick="siguientePasoTour()" id="tour-btn-main">Siguiente</button>
        </div>
      </div>

      <div class="app-header">
        <div class="app-title">Calculadora Pro</div>
        <div class="controls-group">
          <button class="icon-btn" onclick="iniciarTour()" title="Guía">❓</button>
          <button class="icon-btn" onclick="toggleStyle()" title="Estilo" id="tour-btn-estilo">🎨</button>
          <button class="icon-btn" onclick="toggleTheme()" title="Tema" id="tour-btn-tema">🌙</button>
          <button class="icon-btn" onclick="bloquearModoPro()" title="Bloquear / Salir">🔒</button>
        </div>
      </div>

      <div class="form-group" id="tour-step-costo">
        <label>Precio de Costo</label>
        <div class="input-row">
          <input type="text" id="input-costo" class="input-focused" placeholder="0.00" inputmode="none" readonly onfocus="this.removeAttribute('readonly');" oninput="calcularPro()" onclick="activarInput('input-costo')">
          
          <div class="currency-switch" id="tour-step-moneda">
            <button class="currency-btn active" id="btn-usd" onclick="cambiarMoneda('USD')">USD</button>
            <button class="currency-btn" id="btn-cup" onclick="cambiarMoneda('CUP')">CUP</button>
          </div>
          <input type="hidden" id="select-moneda" value="USD">
        </div>
        <small id="costo-equivalente" style="color: var(--text-secondary); font-weight: 700; font-size: 11px; display: none; margin-top: 2px;"></small>
      </div>

      <div class="details-grid">
        <div class="detail-card" id="tour-step-utilidad" onclick="activarInput('input-utilidad')">
          <span class="detail-label">Utilidad</span>
          <div style="display: flex; align-items: center; gap: 2px;">
            <input type="text" id="input-utilidad" value="30" inputmode="none" readonly onfocus="this.removeAttribute('readonly');" oninput="calcularPro()" style="font-size: 13px;">
            <span style="font-size: 12px; font-weight: 700;">%</span>
          </div>
        </div>

        <div class="detail-card" id="tour-step-retiro" onclick="activarInput('input-retiro')">
          <span class="detail-label">% Retiro</span>
          <div style="display: flex; align-items: center; gap: 2px;">
            <input type="text" id="input-retiro" value="25" inputmode="none" readonly onfocus="this.removeAttribute('readonly');" oninput="calcularPro()" style="font-size: 13px;">
            <span style="font-size: 12px; font-weight: 700;">%</span>
          </div>
        </div>

        <div class="detail-card" id="tour-step-tasa" onclick="activarInput('input-tasa')">
          <span class="detail-label">Tasa Cambio</span>
          <input type="text" id="input-tasa" value="750" inputmode="none" readonly onfocus="this.removeAttribute('readonly');" oninput="calcularPro()" style="font-size: 13px;">
        </div>
      </div>

      <div class="result-container" id="tour-step-resultado">
        <div class="result-box-item">
          <div class="result-title">Venta USD</div>
          <div class="result-value" id="res-venta-usd">$0.00</div>
        </div>
        <div class="result-box-item">
          <div class="result-title">Venta CUP</div>
          <div class="result-value" id="res-venta-cup">$0</div>
        </div>
      </div>

      <div class="keypad-container">
        <button class="key-btn" onclick="agregarNumeroPro('7')">7</button>
        <button class="key-btn" onclick="agregarNumeroPro('8')">8</button>
        <button class="key-btn" onclick="agregarNumeroPro('9')">9</button>
        <button class="key-btn action" onclick="borrarPro()">⌫</button>
        
        <button class="key-btn" onclick="agregarNumeroPro('4')">4</button>
        <button class="key-btn" onclick="agregarNumeroPro('5')">5</button>
        <button class="key-btn" onclick="agregarNumeroPro('6')">6</button>
        <button class="key-btn action" onclick="limpiarPro()">C</button>
        
        <button class="key-btn" onclick="agregarNumeroPro('1')">1</button>
        <button class="key-btn" onclick="agregarNumeroPro('2')">2</button>
        <button class="key-btn" onclick="agregarNumeroPro('3')">3</button>
        <button class="key-btn action" onclick="agregarNumeroPro('.')">.</button>
        
        <button class="key-btn" onclick="agregarNumeroPro('0')" style="grid-column: span 2;">0</button>
        <button class="key-btn" onclick="agregarNumeroPro('00')">00</button>
        <button class="key-btn action" onclick="siguienteInputPro()">↵</button>
      </div>
    </div>
  </div>

  <script>
    let expr = "0";
    const CODIGO_SECRETO = "128122";

    function calcPress(val) {
      const screen = document.getElementById('calc-screen');
      if (val === 'C') {
        expr = "0";
      } else if (val === 'DEL') {
        expr = expr.length > 1 ? expr.slice(0, -1) : "0";
      } else if (val === '=') {
        if (expr === CODIGO_SECRETO) {
          abrirModoPro();
          expr = "0";
          screen.innerText = expr;
          return;
        }
        try {
          let resultado = eval(expr.replace('×', '*').replace('÷', '/'));
          expr = String(resultado);
        } catch (e) {
          expr = "Error";
        }
      } else {
        if (expr === "0" || expr === "Error") expr = val;
        else expr += val;
      }
      screen.innerText = expr;
    }

    let inputActivoPro = 'input-costo';

    function abrirModoPro() {
      document.getElementById('view-normal').classList.remove('active');
      document.getElementById('view-pro').classList.add('active');
      activarInput('input-costo');
      calcularPro();

      if (!localStorage.getItem('tour_visto_pro_v3')) {
        setTimeout(iniciarTour, 400);
      }
    }

    function bloquearModoPro() {
      cerrarTour();
      document.getElementById('view-pro').classList.remove('active');
      document.getElementById('view-normal').classList.add('active');
      expr = "0";
      document.getElementById('calc-screen').innerText = expr;
    }

    /* TOUR GUIADO DE 7 PASOS CON VALOR COMERCIAL FINAL */
    let pasoActual = 0;
    const pasosTour = [
      {
        el: 'tour-btn-estilo',
        titulo: 'Paso 1: Estilo Visual',
        desc: 'Toca este botón para alternar el diseño estético de la interfaz.'
      },
      {
        el: 'tour-btn-tema',
        titulo: 'Paso 2: Tema Claro / Oscuro',
        desc: 'Cambia entre modo nocturno o diurno según tu preferencia visual.'
      },
      {
        el: 'tour-step-moneda',
        titulo: 'Paso 3: Moneda Base',
        desc: 'Indica si el costo original del producto viene expresado en USD o en CUP.'
      },
      {
        el: 'tour-step-costo',
        titulo: 'Paso 4: Precio de Costo',
        desc: 'Introduce el valor numérico del costo base usando el teclado inferior.'
      },
      {
        el: 'tour-step-utilidad',
        titulo: 'Paso 5: Margen de Utilidad',
        desc: 'Define el porcentaje de ganancia comercial que deseas aplicarle al producto.'
      },
      {
        el: 'tour-step-retiro',
        titulo: 'Paso 6: Porcentaje de Retiro (-%)',
        desc: 'Configura el descuento por retiro (ej. -25%), que ajusta el precio para compensar comisiones o mermas de salida.'
      },
      {
        el: 'tour-step-tasa',
        titulo: 'Paso 7: Tasa de Cambio (750)',
        desc: 'Controla la tasa vigente (preconfigurada a 750) para garantizar conversiones exactas.'
      },
      {
        el: 'tour-step-resultado',
        titulo: '¡Listo para Vender! 🚀',
        desc: 'Aquí obtendrás de forma instantánea el precio de venta final en USD y CUP. Una herramienta rápida, precisa y sin margen de error para tu negocio.'
      }
    ];

    function iniciarTour() {
      pasoActual = 0;
      document.getElementById('tour-overlay').style.display = 'block';
      let card = document.getElementById('tour-card');
      card.style.display = 'flex';
      setTimeout(() => card.classList.add('visible'), 20);
      mostrarPasoTour();
    }

    function mostrarPasoTour() {
      document.querySelectorAll('.tour-highlight').forEach(el => el.classList.remove('tour-highlight'));

      if (pasoActual >= pasosTour.length) {
        cerrarTour();
        return;
      }

      let paso = pasosTour[pasoActual];
      let elementoDom = document.getElementById(paso.el);
      
      if (elementoDom) {
        elementoDom.classList.add('tour-highlight');
      }

      document.getElementById('tour-badge').innerText = `Paso ${pasoActual + 1} de ${pasosTour.length}`;
      document.getElementById('tour-title').innerText = paso.titulo;
      document.getElementById('tour-desc').innerText = paso.desc;

      let btnMain = document.getElementById('tour-btn-main');
      btnMain.innerText = pasoActual === pasosTour.length - 1 ? 'Empezar a Usar 🎉' : 'Siguiente';

      let dotsContainer = document.getElementById('tour-dots');
      dotsContainer.innerHTML = '';
      for (let i = 0; i < pasosTour.length; i++) {
        let dot = document.createElement('div');
        dot.className = `tour-dot ${i === pasoActual ? 'active' : ''}`;
        dotsContainer.appendChild(dot);
      }
    }

    function siguientePasoTour() {
      pasoActual++;
      mostrarPasoTour();
    }

    function cerrarTour() {
      document.querySelectorAll('.tour-highlight').forEach(el => el.classList.remove('tour-highlight'));
      let card = document.getElementById('tour-card');
      card.classList.remove('visible');
      setTimeout(() => {
        card.style.display = 'none';
        document.getElementById('tour-overlay').style.display = 'none';
      }, 250);
      localStorage.setItem('tour_visto_pro_v3', 'true');
    }

    function activarInput(id) {
      inputActivoPro = id;

      document.getElementById('input-costo').classList.remove('input-focused');
      document.getElementById('tour-step-utilidad').classList.remove('input-focused');
      document.getElementById('tour-step-retiro').classList.remove('input-focused');
      document.getElementById('tour-step-tasa').classList.remove('input-focused');

      if (id === 'input-costo') {
        document.getElementById('input-costo').classList.add('input-focused');
      } else if (id === 'input-utilidad') {
        document.getElementById('tour-step-utilidad').classList.add('input-focused');
      } else if (id === 'input-retiro') {
        document.getElementById('tour-step-retiro').classList.add('input-focused');
      } else if (id === 'input-tasa') {
        document.getElementById('tour-step-tasa').classList.add('input-focused');
      }

      const el = document.getElementById(id);
      if (el) {
        el.setAttribute('inputmode', 'none');
        el.blur();
      }
    }

    function cambiarMoneda(moneda) {
      document.getElementById('select-moneda').value = moneda;
      if (moneda === 'USD') {
        document.getElementById('btn-usd').classList.add('active');
        document.getElementById('btn-cup').classList.remove('active');
      } else {
        document.getElementById('btn-cup').classList.add('active');
        document.getElementById('btn-usd').classList.remove('active');
      }
      calcularPro();
    }

    function agregarNumeroPro(val) {
      const el = document.getElementById(inputActivoPro);
      if (!el) return;
      if (val === '.' && el.value.includes('.')) return;
      el.value += val;
      calcularPro();
    }

    function borrarPro() {
      const el = document.getElementById(inputActivoPro);
      if (!el) return;
      el.value = el.value.slice(0, -1);
      calcularPro();
    }

    function limpiarPro() {
      document.getElementById('input-costo').value = '';
      calcularPro();
    }

    function siguienteInputPro() {
      const inputs = ['input-costo', 'input-utilidad', 'input-retiro', 'input-tasa'];
      let idx = inputs.indexOf(inputActivoPro);
      let nextId = inputs[(idx + 1) % inputs.length];
      activarInput(nextId);
    }

    function calcularPro() {
      const costo = parseFloat(document.getElementById('input-costo').value) || 0;
      const moneda = document.getElementById('select-moneda').value;
      const utilidad = parseFloat(document.getElementById('input-utilidad').value) || 0;
      const tasa = parseFloat(document.getElementById('input-tasa').value) || 750;
      const porcRetiro = parseFloat(document.getElementById('input-retiro').value) || 0;
      const labelEquiv = document.getElementById('costo-equivalente');

      let costoUSD = moneda === 'CUP' ? costo / tasa : costo;

      if (moneda === 'CUP' && costo > 0) {
        labelEquiv.innerText = `Equivalente base: $${costoUSD.toFixed(2)} USD`;
        labelEquiv.style.display = 'block';
      } else {
        labelEquiv.style.display = 'none';
      }

      let divisorRetiro = 1 - (porcRetiro / 100);
      if (divisorRetiro <= 0) divisorRetiro = 0.01;

      let precioConUtilidad = costoUSD * (1 + (utilidad / 100));
      let precioFinalUSD = precioConUtilidad / divisorRetiro;
      let precioFinalCUP = precioFinalUSD * tasa;

      document.getElementById('res-venta-usd').innerText = `$${precioFinalUSD.toFixed(2)}`;
      document.getElementById('res-venta-cup').innerText = `$${precioFinalCUP.toFixed(0)}`;
    }

    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      let iconText = newTheme === 'dark' ? '🌙' : '☀️';
      document.getElementById('tour-btn-tema').innerText = iconText;
      let normalBtn = document.getElementById('normal-theme-btn');
      if (normalBtn) normalBtn.innerText = iconText;
    }

    function toggleStyle() {
      const html = document.documentElement;
      const currentStyle = html.getAttribute('data-style');
      const newStyle = currentStyle === 'feminino' ? 'masculino' : 'feminino';
      html.setAttribute('data-style', newStyle);
    }
  </script>
</body>
</html>
